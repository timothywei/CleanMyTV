name: Build

on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 编译验证（aapt2 → javac → d8 → zipalign → apksigner）
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 工具
        uses: android-actions/setup-android@v4

      - name: 安装 build-tools 与 platform
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools"
          ls "$ANDROID_HOME/platforms"

      - name: 确认工具链
        run: |
          java -version
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      # 只用一次性临时口令签名，验证的是完整链路；产出 APK 与 Release 签名不同，不对外分发
      - name: 构建 APK
        env:
          CMTV_KS_PASS: ci-temporary-keystore
        run: |
          pwsh -NoProfile -File launcher/build.ps1 \
            -Manifest AndroidManifest-ts.xml \
            -OutName CleanMyTV.apk

      - name: 校验产物
        run: |
          ls -lh launcher/CleanMyTV.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs launcher/CleanMyTV.apk
          "$BT/aapt" dump badging launcher/CleanMyTV.apk | head -5

      - name: 上传 APK（仅供排查）
        uses: actions/upload-artifact@v7
        with:
          name: CleanMyTV-ci-apk
          path: launcher/CleanMyTV.apk
          retention-days: 7
          if-no-files-found: error
