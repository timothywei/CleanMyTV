name: Bug 报告
description: 桌面行为异常、崩溃、或装不上？请填写下面的信息以便定位
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。小米电视各机型和系统版本的行为差异很大，**型号和系统版本是必填的**，
        缺了这两项基本无法定位问题。

        提交前请先搜索已有 issue，避免重复。

  - type: input
    id: model
    attributes:
      label: 电视型号
      description: 设置 → 关于 → 设备名称，或执行 `adb shell getprop ro.product.model`
      placeholder: 例如 MiTV_MFFU0 / finch
    validations:
      required: true

  - type: input
    id: osversion
    attributes:
      label: 系统版本
      description: 设置 → 关于 → 系统版本，或执行 `adb shell getprop ro.build.version.incremental`
      placeholder: 例如 OS4.0.11
    validations:
      required: true

  - type: input
    id: appversion
    attributes:
      label: CleanMyTV 版本
      description: 来自 Releases 的版本号，或你自己构建时的 commit
      placeholder: 例如 v1.0.0
    validations:
      required: true

  - type: dropdown
    id: installed
    attributes:
      label: 安装情况
      description: 当前 Home 是否已经成功指向 CleanMyTV？
      options:
        - 已设为 Home，正常工作
        - 已设为 Home，但有异常
        - 装上了，但 Home 还是 PatchWall（set-home-activity 无效）
        - 还没装上
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么？你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 开机进入桌面
        2. 按方向键下选中某个应用
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志（可选，但强烈建议）
      description: |
        执行 `adb logcat -s CleanMyTV:V DbgLog:V` 后复现操作，把相关片段贴进来。
        如果是崩溃，请贴 `adb logcat -b crash` 的内容。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认项
      options:
        - label: 我已搜索过现有 issue，没有找到相同问题
          required: true
        - label: 我使用的是 Releases 里的 APK，或自己从源码构建（不是来路不明的修改版）
          required: true
